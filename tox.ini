[tox]
env_list = linters, molecule-ansible8, molecule-ansible8-debian12, molecule-ansible13
no_package = true

[base]
deps =
  molecule
  molecule-plugins[docker]
  pytest-testinfra
pass_env =
  HOME
  SSH_AUTH_SOCK
  TERM
  TTY
set_env =
  ANSIBLE_HOME = {temp_dir}/ansible
  ANSIBLE_ROLES_PATH = {temp_dir}/ansible/roles
  ANSIBLE_COLLECTIONS_PATH = {temp_dir}/ansible/collections

[testenv:linters]
skip_install = true
deps = pre-commit
commands = pre-commit run --all-files

[testenv:molecule-ansible8]
base_python = python3.11
deps =
  ansible~=8.0
  netaddr
  requests<2.32.0  # https://github.com/ansible-community/molecule-plugins/pull/257
  pytest<8.0.0  # see https://github.com/pytest-dev/pytest/issues/11904
  setuptools<82 # https://setuptools.pypa.io/en/stable/history.html#deprecations-and-removals, pkg_resources used by ansible.builtin.pip
  {[base]deps}
pass_env = {[base]pass_env}
set_env = {[base]set_env}
commands = molecule {posargs:test}

[testenv:molecule-ansible8-debian12]
base_python = python3.11
deps = {[testenv:molecule-ansible8]deps}
pass_env = {[base]pass_env}
set_env =
  {[base]set_env}
  MOLECULE_DEBIAN_VERSION = 12
commands = molecule {posargs:test}

[testenv:molecule-ansible13]
deps =
  ansible<14
  netaddr
  pytest
  {[base]deps}
pass_env = {[base]pass_env}
set_env =
  {[base]set_env}
  MOLECULE_DEBIAN_VERSION = 13
commands = molecule {posargs:test}
